server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router
    # handles client-side routing instead of nginx 404ing on e.g. /goals.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker file must never be cached, or PWA updates get stuck.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
